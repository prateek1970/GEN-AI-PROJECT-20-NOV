<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SILICON ODYSSEY | Founder Intelligence Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- React 18, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #060a12;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    code,
    pre,
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .gradient-title {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-amber {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-card {
      background: rgba(13, 20, 36, 0.78);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 14px 35px -10px rgba(14, 165, 233, 0.15);
    }

    .glass-glow-cyan {
      box-shadow: 0 0 25px -5px rgba(56, 189, 248, 0.2);
    }

    .glass-glow-amber {
      box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.2);
    }

    .glass-glow-emerald {
      box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.2);
    }

    .glass-glow-rose {
      box-shadow: 0 0 25px -5px rgba(244, 63, 94, 0.2);
    }

    /* Subtle dot grid pattern */
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #060a12;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    .animate-pulse-glow {
      animation: pulseGlow 4s infinite ease-in-out;
    }
  </style>
</head>

<body class="min-h-screen bg-[#060a12] text-slate-100 antialiased selection:bg-sky-500 selection:text-slate-950">
  <div id="root"></div>
  <script type="text/babel" src="app.tsx"></script>
</body>

</html>
